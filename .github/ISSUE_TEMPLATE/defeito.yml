name: Defeito
description: Relate um erro encontrado
title: 'fix: '
labels: ['defeito']
body:
  - type: input
    id: versao
    attributes:
      label: Versão / ambiente
      description: 'Ex.: "staging · v0.1.0" (o ambiente aparece em GET /saude)'
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado x obtido
    validations:
      required: true
